<title>Submitly</title>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: control-room shell. Left rail, global filter bar, KPI tiles, charts, virtualised grid with a docked field panel on the right. */
:root{
  --bg:#EDF0F5;--panel:#FFFFFF;--panel2:#F6F8FB;--sunk:#E6EAF0;--line:#D9DFE8;--line2:#C3CCD9;
  --fg:#0F1B2D;--fg2:#34445B;--muted:#67778E;
  --accent:#2B5CE6;--accent-soft:rgba(43,92,230,.10);--accent-fg:#FFFFFF;
  --ok:#14805A;--ok-soft:rgba(20,128,90,.12);--warn:#A86500;--warn-soft:rgba(214,140,20,.16);--crit:#CC2B42;--crit-soft:rgba(204,43,66,.11);
  --c1:#2B5CE6;--c2:#0E95A8;--c3:#7656DD;--c4:#D2841A;--c5:#CC4389;--c6:#5B6C86;--c7:#2A9A57;--c8:#DD6535;
  --dot:rgba(15,27,45,.06);--shadow:0 12px 36px rgba(15,27,45,.16);
  --f-ui:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-cond:"IBM Plex Sans Condensed","IBM Plex Sans",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"Cascadia Mono",Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#070C13;--panel:#0D141E;--panel2:#111A26;--sunk:#0A1018;--line:#1B2635;--line2:#2B3a50;
  --fg:#DCE5F2;--fg2:#AEBBCF;--muted:#7486A0;
  --accent:#5E8DFF;--accent-soft:rgba(94,141,255,.15);--accent-fg:#06101F;
  --ok:#3DD598;--ok-soft:rgba(61,213,152,.13);--warn:#F5B93D;--warn-soft:rgba(245,185,61,.14);--crit:#FF5D73;--crit-soft:rgba(255,93,115,.15);
  --c1:#5E8DFF;--c2:#2CC4D6;--c3:#9D85FF;--c4:#F0A93B;--c5:#F0679F;--c6:#8496B0;--c7:#4CCB82;--c8:#FF8A5B;
  --dot:rgba(140,170,220,.07);--shadow:0 18px 44px rgba(0,0,0,.55);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#070C13;--panel:#0D141E;--panel2:#111A26;--sunk:#0A1018;--line:#1B2635;--line2:#2B3a50;
  --fg:#DCE5F2;--fg2:#AEBBCF;--muted:#7486A0;
  --accent:#5E8DFF;--accent-soft:rgba(94,141,255,.15);--accent-fg:#06101F;
  --ok:#3DD598;--ok-soft:rgba(61,213,152,.13);--warn:#F5B93D;--warn-soft:rgba(245,185,61,.14);--crit:#FF5D73;--crit-soft:rgba(255,93,115,.15);
  --c1:#5E8DFF;--c2:#2CC4D6;--c3:#9D85FF;--c4:#F0A93B;--c5:#F0679F;--c6:#8496B0;--c7:#4CCB82;--c8:#FF8A5B;
  --dot:rgba(140,170,220,.07);--shadow:0 18px 44px rgba(0,0,0,.55);color-scheme:dark}
html,body{height:100%}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font:13px/1.45 var(--f-ui);overflow:hidden}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.mono{font-family:var(--f-mono);font-size:12px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.shell{display:flex;height:100%;min-height:0}
/* rail */
.rail{width:212px;flex:0 0 auto;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.brand{display:flex;gap:10px;align-items:center;padding:14px 14px 12px;border-bottom:1px solid var(--line)}
.brand b{font:700 15px/1 var(--f-cond);letter-spacing:.12em;display:block}
.brand span{font:500 11px/1.3 var(--f-cond);color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.nav{flex:1;overflow:auto;padding:10px 8px;display:flex;flex-direction:column;gap:2px}
.nav h6{margin:12px 8px 4px;font:600 10px/1 var(--f-cond);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.nav button{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;padding:7px 10px;border-radius:6px;text-align:left;color:var(--fg2)}
.nav button:hover{background:var(--panel2);color:var(--fg)}
.nav button.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.nav button svg{flex:0 0 16px}
.nav .cnt{margin-left:auto;font:500 11px var(--f-mono);color:var(--muted)}
.nav .cnt.crit{color:var(--crit)}
.railfoot{border-top:1px solid var(--line);padding:10px 14px;font-size:11px;color:var(--muted);display:grid;gap:4px}
.railfoot div{display:flex;justify-content:space-between;gap:8px}
/* main */
.mainwrap{flex:1;min-width:0;display:flex;flex-direction:column;min-height:0}
.top{display:flex;align-items:center;gap:12px;padding:8px 14px;border-bottom:1px solid var(--line);background:var(--panel);flex-wrap:wrap}
.crumb{display:flex;flex-direction:column;min-width:0;margin-right:auto}
.crumb b{font:600 17px/1.15 var(--f-cond);letter-spacing:.01em}
.crumb small{color:var(--muted);font-size:11.5px}
.iconbtn{border:1px solid var(--line);background:var(--panel2);border-radius:6px;height:30px;min-width:30px;display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:0 8px;color:var(--fg2)}
.iconbtn:hover{border-color:var(--line2);color:var(--fg)}
.search{display:flex;align-items:center;gap:8px;height:30px;border:1px solid var(--line);background:var(--sunk);border-radius:6px;padding:0 10px;color:var(--muted);min-width:260px}
.search kbd{margin-left:auto;font:500 10.5px var(--f-mono);border:1px solid var(--line2);border-radius:4px;padding:1px 5px}
.clock{display:flex;align-items:center;gap:7px;font:500 12px var(--f-mono);color:var(--fg2)}
.live{width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 3px var(--ok-soft);animation:pulse 2s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 6px transparent}}
.usersel{height:30px;border:1px solid var(--line);background:var(--panel2);border-radius:6px;padding:0 6px;max-width:250px}
.gf{display:flex;align-items:center;gap:8px;padding:8px 14px;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap}
.gf label{font:600 10px/1 var(--f-cond);text-transform:uppercase;letter-spacing:.12em;color:var(--muted)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--sunk)}
.seg button{border:0;background:none;padding:5px 10px;font-size:12px;color:var(--fg2)}
.seg button.on{background:var(--accent);color:var(--accent-fg);font-weight:600}
.gsel{height:28px;border:1px solid var(--line);background:var(--panel2);border-radius:6px;padding:0 6px;max-width:210px;font-size:12px}
.dpbtn{height:28px;display:inline-flex;gap:8px;align-items:center;border:1px solid var(--line);background:var(--panel2);border-radius:6px;padding:0 10px;font-size:12px}
.dpbtn .tag{font:600 10.5px var(--f-mono);background:var(--accent-soft);color:var(--accent);border-radius:4px;padding:1px 5px}
.fresh{display:flex;gap:14px;padding:5px 14px;font-size:11px;color:var(--muted);border-bottom:1px solid var(--line);background:var(--panel2);overflow-x:auto;white-space:nowrap}
.fresh span b{color:var(--fg2);font-weight:500;font-family:var(--f-mono);font-size:10.5px}
.fresh .late b{color:var(--warn)}
.banner{display:flex;gap:10px;align-items:center;padding:7px 14px;background:var(--warn-soft);color:var(--fg);border-bottom:1px solid var(--line);font-size:12px}
.banner b{color:var(--warn)}
.banner button{margin-left:auto;border:0;background:none;color:var(--muted)}
.body{flex:1;display:flex;min-height:0}
.content{flex:1;min-width:0;overflow:auto;padding:14px 16px 20px;display:flex;flex-direction:column;gap:14px;background-image:radial-gradient(var(--dot) 1px,transparent 1px);background-size:18px 18px}
/* tiles */
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.tile{position:relative;text-align:left;border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:11px 12px 10px;display:flex;flex-direction:column;gap:3px;overflow:hidden;min-width:0}
.tile::before{content:"";position:absolute;left:0;top:0;right:0;height:2px;background:var(--line2)}
.tile.ok::before{background:var(--ok)}.tile.warn::before{background:var(--warn)}.tile.crit::before{background:var(--crit)}.tile.info::before{background:var(--accent)}
.tile:hover{border-color:var(--line2)}
.tile.on{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.tile .tl{font:600 10.5px/1.2 var(--f-cond);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.tile .tn{font:600 24px/1.1 var(--f-cond);font-variant-numeric:tabular-nums;letter-spacing:.01em}
.tile.crit .tn{color:var(--crit)}.tile.warn .tn{color:var(--warn)}
.tile .ts{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .drill{position:absolute;right:9px;top:9px;color:var(--muted);opacity:.0;transition:.15s}
.tile:hover .drill{opacity:1}
/* charts */
.charts{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:10px}
.card{border:1px solid var(--line);background:var(--panel);border-radius:8px;min-width:0}
.card h3{margin:0;font:600 12px/1.2 var(--f-cond);letter-spacing:.06em;text-transform:uppercase;color:var(--fg2);display:flex;gap:8px;align-items:center}
.card h3 small{text-transform:none;letter-spacing:0;font:400 11px var(--f-ui);color:var(--muted);margin-left:auto}
.chart{padding:11px 12px 8px}
.chart svg{display:block;width:100%;height:auto}
.chart svg text{fill:var(--muted);font:10px var(--f-mono)}
.chart svg .lbl{fill:var(--fg2)}
.chart .hit{cursor:pointer}
.chart .hit:hover{opacity:.8}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:11px;color:var(--fg2);margin-top:4px}
.legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;vertical-align:-1px}
/* grid card */
.gridcard{display:flex;flex-direction:column;min-height:460px;height:calc(100vh - 150px)}
.gtool{display:flex;gap:8px;align-items:center;padding:8px 10px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.gtool .count{font:500 12px var(--f-mono);color:var(--fg2)}
.gtool .refresh{font-size:11px;color:var(--muted)}
.btn{height:28px;border:1px solid var(--line);background:var(--panel2);border-radius:6px;padding:0 10px;font-size:12px;display:inline-flex;align-items:center;gap:6px;color:var(--fg2)}
.btn:hover{border-color:var(--line2);color:var(--fg)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-fg);font-weight:600}
.btn.danger{color:var(--crit);border-color:var(--crit-soft)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.jump{height:28px;border:1px solid var(--line);background:var(--sunk);border-radius:6px;padding:0 8px;width:170px;font-size:12px}
.chips{display:flex;gap:6px;flex-wrap:wrap;padding:6px 10px;border-bottom:1px solid var(--line);min-height:0}
.chips:empty{display:none}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--accent-soft);background:var(--accent-soft);color:var(--fg);border-radius:999px;padding:2px 4px 2px 10px;font-size:11.5px}
.chip b{font-weight:600;color:var(--accent)}
.chip button{border:0;background:none;color:var(--muted);width:18px;height:18px;border-radius:50%}
.chip button:hover{background:var(--panel);color:var(--crit)}
.chip.clear{background:none;border-color:var(--line);padding:2px 10px;cursor:pointer;color:var(--muted)}
.gwrap{position:relative;flex:1;min-height:0}
.gscroll{position:absolute;inset:0;overflow:scroll;outline:none}
.gh{position:sticky;top:0;z-index:3;display:flex;height:48px;background:var(--panel2);border-bottom:1px solid var(--line2)}
.hc{position:relative;flex:0 0 auto;border-right:1px solid var(--line);padding:6px 22px 4px 9px;display:flex;flex-direction:column;justify-content:center;background:var(--panel2);user-select:none;cursor:grab}
.hc .hn{font:500 10px/1.1 var(--f-mono);color:var(--muted);display:flex;gap:5px;align-items:center}
.hc .hl{font:600 12px/1.25 var(--f-cond);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--fg)}
.hc .fb{position:absolute;right:4px;top:50%;transform:translateY(-50%);border:0;background:none;color:var(--muted);width:18px;height:22px;padding:0;border-radius:4px}
.hc .fb:hover{background:var(--sunk);color:var(--fg)}
.hc .fb.on{color:var(--accent)}
.hc .rz{position:absolute;right:-4px;top:0;bottom:0;width:8px;cursor:col-resize;z-index:2}
.hc.pin,.gc.pin{position:sticky;z-index:2}
.hc.pin{z-index:4}
.hc.lastpin,.gc.lastpin{box-shadow:4px 0 6px -4px rgba(0,0,0,.35);border-right-color:var(--line2)}
.sortk{font:600 10px var(--f-mono);color:var(--accent)}
.badge{font:600 9px/1 var(--f-mono);border-radius:3px;padding:2px 3px;letter-spacing:.03em}
.b-both{background:var(--sunk);color:var(--fg2)}.b-esma{background:var(--accent-soft);color:var(--accent)}.b-fca{background:rgba(118,86,221,.15);color:var(--c3)}.b-ops{background:var(--warn-soft);color:var(--warn)}
.gbody{position:relative}
.gr{position:absolute;left:0;display:flex;height:30px;border-bottom:1px solid var(--line);background:var(--panel);cursor:pointer}
.gr:nth-child(even),.gr:nth-child(even) .gc.pin{background:var(--panel2)}
.gr:hover,.gr:hover .gc.pin{background:var(--accent-soft)}
.gr.sel,.gr.sel .gc.pin{background:var(--accent-soft)}
.gc{flex:0 0 auto;padding:0 9px;line-height:29px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-right:1px solid var(--line);font-size:12px;background:inherit}
.gc.pin{background:var(--panel)}
.gc.r{text-align:right;font-variant-numeric:tabular-nums}
.gc.m{font-family:var(--f-mono);font-size:11.5px}
.gc.act{outline:2px solid var(--accent);outline-offset:-2px}
.gc.na{background-image:repeating-linear-gradient(135deg,transparent 0 5px,var(--sunk) 5px 6px)}
.gc.hl{background:var(--crit-soft)!important}
.gsp{flex:0 0 auto}
.dropline{position:absolute;top:0;bottom:0;width:2px;background:var(--accent);z-index:6;pointer-events:none;box-shadow:0 0 8px var(--accent)}
.empty{position:absolute;inset:48px 0 0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:var(--muted);pointer-events:none}
.pill{display:inline-flex;align-items:center;gap:4px;border-radius:4px;padding:0 6px;line-height:19px;font:600 10.5px var(--f-mono);vertical-align:middle;white-space:nowrap}
.p-ok{background:var(--ok-soft);color:var(--ok)}.p-crit{background:var(--crit-soft);color:var(--crit)}.p-warn{background:var(--warn-soft);color:var(--warn)}.p-info{background:var(--accent-soft);color:var(--accent)}.p-mut{background:var(--sunk);color:var(--fg2)}
/* field panel */
.fpanel{width:320px;flex:0 0 auto;border-left:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;position:relative;min-height:0}
.fpanel.col{width:32px}
.fpanel .rzl{position:absolute;left:-4px;top:0;bottom:0;width:8px;cursor:col-resize;z-index:5}
.fptab{writing-mode:vertical-rl;border:0;background:none;height:100%;width:32px;font:600 11px var(--f-cond);letter-spacing:.16em;color:var(--muted);display:flex;align-items:center;justify-content:flex-start;gap:8px;padding-top:12px}
.fph{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line)}
.fph b{font:600 13px var(--f-cond);letter-spacing:.06em;text-transform:uppercase}
.fph small{color:var(--muted);font-size:11px}
.fpsec{padding:8px 12px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:6px}
.fpsec .row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.fpsec input[type=search]{height:30px;border:1px solid var(--line);background:var(--sunk);border-radius:6px;padding:0 8px;width:100%}
.fptree{flex:1;overflow:auto;padding:4px 0 10px}
.fg{border-bottom:1px solid var(--line)}
.fgh{display:flex;align-items:center;gap:6px;padding:7px 12px;cursor:pointer;font:600 11.5px var(--f-cond);letter-spacing:.04em;color:var(--fg2);position:sticky;top:0;background:var(--panel);z-index:1}
.fgh .n{font:500 10.5px var(--f-mono);color:var(--muted)}
.fgh .add{margin-left:auto;border:0;background:none;color:var(--accent);font-size:11px;padding:2px 4px;border-radius:4px}
.fgh .add:hover{background:var(--accent-soft)}
.fi{display:grid;grid-template-columns:16px 40px minmax(0,1fr) auto 12px 12px;gap:6px;align-items:center;padding:4px 12px 4px 14px;cursor:grab;font-size:12px}
.fi:hover{background:var(--panel2)}
.fi .no{font:500 10.5px var(--f-mono);color:var(--muted)}
.fi .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fi .mco{font:600 9.5px var(--f-mono);color:var(--muted);width:12px;text-align:center}
.fi.in .nm{color:var(--accent)}
.fi .tick{color:var(--accent);width:12px}
.fpfoot{border-top:1px solid var(--line);padding:8px 12px;display:flex;gap:6px;align-items:center;font-size:11.5px;color:var(--muted)}
.fpfoot .btn{margin-left:auto}
/* drawer */
.scrim{position:fixed;inset:0;background:rgba(5,10,20,.38);z-index:30}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(820px,100%);background:var(--panel);border-left:1px solid var(--line2);z-index:31;display:flex;flex-direction:column;box-shadow:var(--shadow);animation:slide .18s ease-out}
@keyframes slide{from{transform:translateX(30px);opacity:.4}}
.dh{padding:14px 16px 0;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.dh .t{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.dh .uti{font:600 13px var(--f-mono);word-break:break-all}
.dh .close{margin-left:auto}
.dmeta{display:flex;gap:16px;flex-wrap:wrap;font-size:11.5px;color:var(--muted)}
.dmeta b{color:var(--fg2);font-weight:500}
.tabs{display:flex;gap:2px;overflow-x:auto}
.tabs button{border:0;background:none;padding:8px 12px;border-bottom:2px solid transparent;color:var(--muted);white-space:nowrap;font-weight:500}
.tabs button.on{color:var(--accent);border-bottom-color:var(--accent)}
.tabs .tb{font:600 10px var(--f-mono);background:var(--crit-soft);color:var(--crit);border-radius:3px;padding:0 4px;margin-left:4px}
.db{flex:1;overflow:auto;padding:14px 16px}
.ftab{width:100%;border-collapse:collapse;font-size:12px}
.ftab th{position:sticky;top:-14px;background:var(--panel);text-align:left;font:600 10px var(--f-cond);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding:6px 8px;border-bottom:1px solid var(--line2);z-index:1}
.ftab td{padding:5px 8px;border-bottom:1px solid var(--line);vertical-align:top}
.ftab td.v{font-family:var(--f-mono);font-size:11.5px;word-break:break-all}
.ftab tr.grp td{background:var(--panel2);font:600 11px var(--f-cond);letter-spacing:.08em;text-transform:uppercase;color:var(--fg2);padding:7px 8px}
.ftab tr.err td{background:var(--crit-soft)}
.ftab tr.err td:first-child{box-shadow:3px 0 0 var(--crit) inset}
.ftab tr.diff td.v{color:var(--warn)}
.ftab tr.diff td.v.same{color:inherit}
.errbox{border:1px solid var(--crit-soft);background:var(--crit-soft);border-radius:6px;padding:8px 10px;margin:4px 0;font-size:11.5px}
.errbox code{font-family:var(--f-mono);font-size:11px;word-break:break-all}
.tl{list-style:none;margin:0;padding:0 0 0 18px;border-left:2px solid var(--line);display:flex;flex-direction:column;gap:12px}
.tl li{position:relative}
.tl li::before{content:"";position:absolute;left:-25px;top:4px;width:10px;height:10px;border-radius:50%;background:var(--panel);border:2px solid var(--line2)}
.tl li.ok::before{border-color:var(--ok)}.tl li.crit::before{border-color:var(--crit);background:var(--crit)}.tl li.warn::before{border-color:var(--warn)}.tl li.info::before{border-color:var(--accent)}
.tl .h{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tl .s{font-size:11.5px;color:var(--muted)}
.flag{border:1px solid var(--warn-soft);background:var(--warn-soft);border-radius:6px;padding:6px 9px;font-size:11.5px;margin-top:4px}

    $('#bok').onclick=()=>{const t=$('#bc').value.trim();if(!t)return;doBulk(rows,'Bulk commented',e=>{e.comments.push({ts:now(),who:USER.name,text:t});e.lastComment=t},'')};

    $('#bok').onclick=()=>doBulk(rows,'Bulk tagged root cause',e=>{e.root=$('#br').value},'"'+$('#br').value+'"');

function doBulk(rows,what,fn,tail){const snapshot=rows.map(e=>[e,JSON.stringify([e.team,e.assignee,e.status,e.root,e.comments.length,e.lastComment])]);rows.forEach(e=>{fn(e);e.history.push({ts:now(),who:USER.name,what:what+(tail?' '+tail:'')})});

/* ---------- bulk resubmission with four-eyes ---------- */
function preCheck(e){// deterministic pre-submission re-validation
  if(e.type==='LEI lapsed'||e.rule==='EMIR-1.9-LEI-04'&&!e.root.includes('fixed'))return(e.u&&e.u.ocp===LAPSED_OCP&&!e.leiFixed)?'EMIR-1.9-LEI-04: counterparty 2 LEI still LAPSED':null;
  if(e.status==='Pending fix (upstream)')return e.rule+': upstream fix not yet received';return hash(e.id)%25===0?e.rule+': value still fails validation':null}
function bulkResub(rows){const n=rows.length,thr=localThreshold();if(n>50000)return toast('Maximum 50,000 records per batch. Narrow the selection.');
  const four=n>thr;modal('Bulk resubmission',`<div class="stat"><span><b>${SPLIT(n)}</b>records</span><span><b>${four?'Required':'Not required'}</b>second-person approval (> ${thr})</span></div>
   <p class="muted" style="margin:0">Pre-submission validation re-runs on the batch. Only passing records are sent. Failures are returned with reasons. Resubmission cannot be reversed.</p>
   <div class="frm"><label class="muted" for="brn">Reason</label><input class="inp" id="brn" style="flex:1" placeholder="e.g. LEI renewed in GLEIF, static data corrected"></div><div class="err" id="bre" style="color:var(--crit)"></div>`,
   `<button class="btn" data-close>Cancel</button><button class="btn pri" id="bok">${four?'Request approval':'Resubmit now'}</button>`);
  $('#bok').onclick=()=>{const note=$('#brn').value.trim();if(!note){$('#bre').textContent='Enter a reason for the audit trail';return}
    const req={id:'BR-'+String(++BRSEQ).padStart(4,'0'),by:USER.name,byId:USER.id,n,rows:rows.slice(),note,state:four?'Pending approval':'Done',ts:now()};HOLD.unshift(req);rows.forEach(e=>{if(four){e.pending=req.id;e.history.push({ts:now(),who:USER.name,what:'Bulk resubmission '+req.id+' requested; pending approval'})}});
    logA('Requested bulk resubmission',req.id+' · '+SPLIT(n)+' records');closeModal();
    if(four){toast(req.id+' is waiting for a second approver');refresh()}else runResub(req)}}
function runResub(req){const fails=[];let ok=0;req.rows.forEach(e=>{e.pending=null;const f=preCheck(e);if(f)fails.push([e,f]);else{ok++;e.status='Resubmitted';e.attempts++;e.history.push({ts:now(),who:req.by,what:'Resubmitted via '+req.id+' (attempt '+e.attempts+')'});if(e.row)e.row.status='PDNG'}});
  req.state='Done';req.ok=ok;req.fails=fails;BULKLOG.unshift({id:req.id,ts:now(),user:req.by,action:'Bulk resubmission '+req.id,n:req.n});logA('Bulk resubmission executed',req.id+' · '+ok+' sent, '+fails.length+' returned');
  refresh();modal('Resubmission '+req.id+' result',`<div class="stat"><span><b style="color:var(--ok)">${SPLIT(ok)}</b>resubmitted</span><span><b style="color:var(--crit)">${SPLIT(fails.length)}</b>returned with reasons</span></div>
   ${fails.length?`<div class="tblwrap"><table class="tbl"><thead><tr><th>Exception</th><th>UTI</th><th>Reason</th></tr></thead><tbody>${fails.slice(0,200).map(([e,f])=>`<tr><td class="mono">${e.id}</td><td class="mono">${h(e.uti.slice(0,26))}…</td><td>${h(f)}</td></tr>`).join('')}</tbody></table></div>`:''}`,'<button class="btn pri" data-close>Done</button>')}
function showApprovals(){const p=HOLD.filter(x=>x.state==='Pending approval');
  modal('Bulk resubmissions pending approval',p.length?`<div class="tblwrap" style="max-height:55vh"><table class="tbl"><thead><tr><th>Request</th><th>Records</th><th>Requested by</th><th>Reason</th><th></th></tr></thead><tbody>${p.map(x=>{const self=x.byId===USER.id;return`<tr><td class="mono">${x.id}</td><td>${SPLIT(x.n)}</td><td>${h(x.by)}</td><td>${h(x.note)}</td><td style="white-space:nowrap">${can('approve')?(self?'<span class="muted">Cannot approve own request</span>':`<button class="btn pri" data-ap="${x.id}">Approve</button> <button class="btn danger" data-rj="${x.id}">Reject</button>`):'<span class="muted">Approver role needed</span>'}</td></tr>`}).join('')}</tbody></table></div>`:'<p class="muted" style="margin:0">Nothing is waiting. Request a resubmission of more than '+localThreshold()+' records from the exception grid to see it here.</p>','<button class="btn pri" data-close>Close</button>',true);
  $('#mbg').onclick=e=>{const a=e.target.closest('[data-ap]'),r=e.target.closest('[data-rj]');if(!a&&!r)return;const req=HOLD.find(x=>x.id===(a||r).dataset.ap||x.id===(a||r).dataset.rj);
    if(r){req.state='Rejected';req.rows.forEach(e=>e.pending=null);logA('Rejected bulk resubmission',req.id);closeModal();refresh();toast(req.id+' rejected');return}
    if(req.byId===USER.id){toast('The requester cannot approve their own request');return}logA('Approved bulk resubmission',req.id+' · '+SPLIT(req.n)+' records');closeModal();runResub(req)}}

/* ---------- record drawer ---------- */
let REC=null,RTAB='fields',HLF=null,HLB=null;
function openRecord(r){REC=r;RTAB=r.k==='E'?'exc':'fields';drawDrawer()}
function closeDrawer(){$('#drawerRoot').innerHTML='';REC=null}
function recFields(r){const src=r.k==='E'?(r.row||(BYUTI.get(r.uti)||[]).find(x=>x.regime===GF.regime)||r):r;const isMargin=src.k==='C';return{src,isMargin,list:FIELDS.filter(f=>!f.op&&(isMargin?f.tab===3:f.tab!==3))}}
function xmlFor(r){const{src}=recFields(r);const isM=src.k==='C';const ind=n=>'  '.repeat(n);const L=[];const g=id=>{const f=FBY[id];return fmtVal(val(src,f),f)};
  L.push('<?xml version="1.0" encoding="UTF-8"?>',`<Document xmlns="urn:iso:std:iso:20022:tech:xsd:${isM?'auth.108.001.03':'auth.030.001.03'}">`,ind(1)+(isM?'<DerivsMrgnRptV03>':'<DerivsTradRptV03>'),ind(2)+`<RptHdr><MsgId>${src.msg}</MsgId><CreDtTm>${fmtTs(src.ts)}</CreDtTm></RptHdr>`);
  const tag=f=>f.iso.split('/').pop().replace(/[{}|]/g,'').slice(0,28)||'Fld';
  const list=FIELDS.filter(f=>!f.op&&(isM?f.tab===3:f.tab!==3)&&(f.reg==='Both'||f.reg===src.regime));
  let n=0;list.forEach(f=>{const v=val(src,f);if(v===''||v===NA||n>40)return;n++;L.push(ind(3)+`<${tag(f).replace(/[^A-Za-z0-9]/g,'')} fld="${f.no}">${h(fmtVal(v,f))}</${tag(f).replace(/[^A-Za-z0-9]/g,'')}>`)});
  L.push(ind(3)+`<!-- ${list.length-n} further fields omitted in preview -->`,ind(1)+(isM?'</DerivsMrgnRptV03>':'</DerivsTradRptV03>'),'</Document>');return L.join('\n')}
function csum(s){let a=0x811c9dc5,b=0x1b873593;for(let i=0;i<s.length;i++){a=Math.imul(a^s.charCodeAt(i),16777619)>>>0;b=Math.imul(b+s.charCodeAt(i),2246822519)>>>0}return(a.toString(16).padStart(8,'0')+b.toString(16).padStart(8,'0')).repeat(4)}
function drawDrawer(){const r=REC;if(!r)return;const{src,isMargin,list}=recFields(r);const e=exOf(r)||exOf(src);const rule=ruleOf(r)||ruleOf(src);
  const tabs=[['fields','All fields'],['compare','As reported vs held'],['history','Submission history'],['xml','XML & feedback'],['exc','Exceptions'+(e?'':'')]].concat(src.k==='P'||(src.u&&src.u.constit)?[['cons','Constituent trades']]:[]);
  const ttl=isMargin?src.pf:r.uti;
  $('#drawerRoot').innerHTML=`<div class="scrim" id="dscrim"></div><aside class="drawer" role="dialog" aria-label="Full record view"><div class="dh"><div class="t"><span class="uti">${h(ttl)}</span><span class="pill p-mut">${h(src.regime)}</span><span class="pill p-mut">${h(src.action||'')}</span>${pill(stat(src))}<button class="iconbtn close" id="dclose" aria-label="Close">✕</button></div>
   <div class="dmeta"><span>Reporting counterparty <b>${h(LEINAME[RCP[src.rcp]?.lei]||'')}</b></span><span>Other counterparty <b>${h((OCP[isMargin?src.ocp:src.u.ocp]||{}).name||'')}</b></span><span>TR <b>${h(src.tr||'')}</b></span><span>Reported <b class="mono">${fmtTs(src.ts)}</b></span></div>
   <div class="tabs" role="tablist">${tabs.map(([k,l])=>`<button role="tab" data-rt="${k}" class="${RTAB===k?'on':''}">${l}${k==='fields'&&rule&&src.status==='RJCT'?'<span class="tb">1</span>':''}</button>`).join('')}</div></div><div class="db" id="rbody"></div></aside>`;
  $('#dscrim').onclick=closeDrawer;$('#dclose').onclick=closeDrawer;$('.tabs').onclick=ev=>{const b=ev.target.closest('[data-rt]');if(!b)return;RTAB=b.dataset.rt;drawDrawer()};
  const body=$('#rbody');logA('Viewed record',ttl.slice(0,26)+'…');

function fieldsTab(src,list,rule,isMargin){let last='',rows='';const ex=HLF||(rule&&src.status==='RJCT'?rule.f:null);
  const sec={'1':'Table 1 · Counterparty data','2a':'Table 2 · 2a Contract & identifiers','2b':'Table 2 · 2b Valuation & collateral','2c':'Table 2 · 2c Risk mitigation (Confirmation group)','2d':'Table 2 · 2d Clearing','2e':'Table 2 · 2e Transaction details','2f':'Table 2 · 2f Lifecycle','3':'Table 3 · Margin data'};
  let n=0;list.forEach(f=>{if(f.reg!=='Both'&&f.reg!==src.regime)return;n++;if(f.sec!==last){rows+=`<tr class="grp"><td colspan="6">${sec[f.sec]||f.sec}</td></tr>`;last=f.sec}
    const v=val(src,f);const s=fmtVal(v,f);const dec=f.type==='code'&&CODE_DESC[s]?` <span class="muted" style="font-family:var(--f-ui)">· ${h(CODE_DESC[s])}</span>`:'';
    const bad=ex===f.no;rows+=`<tr class="${bad?'err':''}"><td class="mono muted">${f.no}</td><td>${h(f.name)} <span class="badge b-${f.reg==='Both'?'both':f.reg.toLowerCase()}">${f.reg==='Both'?'EU·UK':f.reg}</span></td><td class="v">${s?h(s)+dec:'<span class="muted" style="font-family:var(--f-ui)">—</span>'}${bad?`<div class="errbox"><b>${h(rule.code)}</b> · ${h(rule.id)}<br>${h(rule.desc)}<br><code>${h(rule.xp)}</code></div>`:''}</td><td class="mono muted">${f.mco}</td><td class="mono muted">v${1+hash(f.no)%4}.${hash(f.no+'x')%6}</td><td class="muted">${h(f.src)}</td></tr>`});

  return`<div class="frm" style="margin-bottom:10px"><span class="muted">${n} fields shown for ${h(src.regime)} · dictionary count for this report type: ${ds.filter(f=>f.reg==='Both'||f.reg===src.regime).length} <span title="Subset of the full 203/204 field set shown in this example; full set comes from the Data Dictionary at run time.">(example subset of ${src.regime==='ESMA'?203:204})</span></span></div><div style="overflow:auto"><table class="ftab"><thead><tr><th style="width:56px">No.</th><th>Field</th><th>Reported value</th><th>M/C/O</th><th>Rule ver.</th><th>Source</th></tr></thead><tbody>${rows}</tbody></table></div>`}
function compareTab(src,list){const pick=list.filter(f=>['2.21','2.22','2.23','2.24','2.46','2.47','2.28','2.29','2.9','2.151','2.152','1.9','2.40','2.44','3.10','3.11','3.17'].includes(f.no));
  const h1=hash(src.uti||src.pf||'');const rows=pick.map(f=>{const rep=fmtVal(val(src,f),f);let tr=rep,cur=rep;
    if(f.no==='2.21'&&src.u&&src.u.valDay!=null){cur=NF.format(src.u.valAmt*1.0004+3)}
    if(f.no==='2.28'&&src.u&&src.u.conf)cur=fmtTs(src.u.conf+7*60000);
    if(f.no==='2.9'&&src.status==='RJCT')tr='(rejected, not held)';

function historyTab(src){const list=(BYUTI.get(src.uti)||[]).filter(x=>x.regime===src.regime).sort((a,b)=>a.ts-b.ts);if(!list.length)return'<p class="muted">No trade-level submissions are linked to this record.</p>';
  const items=list.map(x=>{const flag=seqFlag(x);const tone=x.status==='RJCT'?'crit':x.status==='ACPT'?'ok':x.status==='WARN'?'warn':'info';
    return`<li class="${tone}"><div class="h"><b class="mono">${x.action}</b><span class="pill p-mut">${x.regime}</span>${x.event?`<span class="muted">${x.event}</span>`:''}${pill(stat(x))}<span class="mono muted" style="margin-left:auto">${fmtTs(x.ts)}</span></div><div class="s">${h(x.tr)} · file ${h(x.file)} · message ${h(x.msg)}${x.rej?' · '+h(x.rej.code):''}</div>${flag?`<div class="flag">⚠ ${h(flag)}</div>`:''}</li>`}).join('');

function xmlTab(body,src,rule){const x=xmlFor(src);const cs=csum(x).slice(0,64);const hi=h(x).replace(/&lt;(\/?)([A-Za-z0-9:]+)([^&]*?)(\/?)&gt;/g,(m,a,b,c)=>`<span class="tg">&lt;${a}${b}</span><span class="at">${c}</span><span class="tg">&gt;</span>`);
  body.innerHTML=`<dl class="kv" style="margin-bottom:12px"><dt>Message ID</dt><dd>${src.msg}</dd><dt>File ID</dt><dd>${h(src.file)}</dd><dt>Schema</dt><dd>${src.k==='C'?'auth.108.001.03 (margin report)':'auth.030.001.03 (trade report)'}</dd><dt>Checksum (SHA-256)</dt><dd>${cs} <span class="pill p-ok">matches stored copy</span></dd>
   <dt>TR feedback</dt><dd>${src.status==='PDNG'?'Awaiting TR feedback':pill(src.status)+' '+fmtTs(src.fbTs)+' · '+src.fbType+(rule&&src.status==='RJCT'?' · '+rule.code:'')}</dd></dl><div class="frm" style="margin-bottom:8px"><button class="btn" id="xcp">Copy XML</button><span class="muted" style="font-size:11.5px">The exact submitted message, read-only.</span></div><div class="xml">${hi}</div>`;

    ${page.map((e,i)=>`<tr class="click" data-e="${TOPS.page*100+i}"><td class="mono">${e.id}</td><td class="mono">${h(e.uti.slice(0,24))}…</td><td>${h(e.type)}</td><td class="mono" style="font-size:11px">${h(e.rule||'')}${e.fno?' · '+e.fno:''}</td><td>${pill(sumStatus(e)==='Open'?'New':sumStatus(e)==='In Remediation'?'In progress':sumStatus(e)).replace(/(New|In progress)</,(m,a)=>(a==='New'?'Open':'In Remediation')+'<')}${slaStatus(e)==='Breached'?' <span class="pill p-crit">✕ SLA</span>':''}</td><td>${h(e.assignee||e.team)}</td><td class="mono">${fmtTs(slaDue(e)).slice(0,16)}</td><td style="text-align:right">${bdAgo(e.created).toFixed(1)}</td></tr>`).join('')}</tbody></table></div>
    <div class="frm" style="padding:8px 12px"><button class="btn" id="tprev"${TOPS.page?'':' disabled'}>Previous</button><span class="muted">${list.length?TOPS.page*100+1:0}–${Math.min(list.length,TOPS.page*100+100)} of ${NF0.format(list.length)}</span><button class="btn" id="tnext"${(TOPS.page+1)*100<list.length?'':' disabled'}>Next</button><span class="muted" style="margin-left:auto;font-size:11px">Export limit ${NF0.format(CFG.limit)} rows</span></div></div>`;
  const on=(id,f)=>{const x=$('#'+id);if(x)x.onchange=e=>{f(e.target.value);TOPS.page=0;renderTop()}};
  on('tdim',v=>{TOPS.dim=v;TOPS.sel=null});on('tn',v=>TOPS.n=+v);on('tcat',v=>TOPS.cat=v);on('tsrc',v=>TOPS.src=v);on('tage',v=>TOPS.age=v);on('tteam',v=>TOPS.team=v);on('tsla',v=>TOPS.sla=v);
  $('#extra').querySelectorAll('[data-st]').forEach(b=>b.onclick=()=>{const s=b.dataset.st;TOPS.st=TOPS.st.includes(s)?TOPS.st.filter(x=>x!==s):TOPS.st.concat(s);TOPS.page=0;renderTop()});
  $('#extra').querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{TOPS.sel=TOPS.sel===b.dataset.c?null:b.dataset.c;TOPS.page=0;renderTop()});
  $('#extra').querySelectorAll('[data-e]').forEach(b=>b.onclick=()=>openRecord(list[+b.dataset.e]));
  const c=$('#tclr');if(c)c.onclick=()=>{TOPS.sel=null;renderTop()};$('#tprev').onclick=()=>{TOPS.page--;renderTop()};$('#tnext').onclick=()=>{TOPS.page++;renderTop()};
  $('#towl').onclick=()=>handoff('exc');$('#tbulk').onclick=()=>handoff('bulk');
  const x=$('#tcsv');if(x)x.onclick=()=>{const cols=[{label:'Exception ID',get:e=>e.id},{label:'UTI',get:e=>e.uti},{label:'Exception type',get:e=>e.type},{label:'Category',get:excCat},{label:'Rule / field',get:e=>(e.rule||'')+(e.fno?' · '+e.fno:'')},{label:'Summary status',get:sumStatus},{label:'Owner',get:e=>e.assignee||e.team},
    {label:'SLA due (UTC)',get:e=>fmtTs(slaDue(e))},{label:'SLA breached',get:e=>slaStatus(e)==='Breached'?'Y':'N'},{label:'Age (business days)',get:e=>bdAgo(e.created).toFixed(2),num:true},{label:'Legal entity LEI',get:e=>RCP[e.rcp]?RCP[e.rcp].lei:'',lei:true},{label:'Counterparty LEI',get:e=>e.u&&OCP[e.u.ocp]?OCP[e.u.ocp].lei:'',lei:true},{label:'Desk',get:e=>e.desk},{label:'Source system',get:e=>e.src}];
    const fd=['Regime EMIR','Date '+fmtD(GF.from)+'..'+fmtD(GF.to),'Entity '+(GF.lei?LEINAME[GF.lei]:'all entitled'),'Report types '+(GF.rtypes.join('/')||'all'),'Status '+TOPS.st.join('/'),TOPS.cat&&'Category '+TOPS.cat,TOPS.src&&'Source '+TOPS.src,TOPS.age&&'Ageing '+TOPS.age,TOPS.team&&'Owner '+TOPS.team,TOPS.sla&&'SLA breached '+TOPS.sla,TOPS.sel!=null&&TOPS.dim+' = '+TOPS.sel].filter(Boolean).join('; ');
    exportRows('Exceptions',list,cols,fd,CFG.limit)}}
function handoff(to){const k=TOPS.sel,d=TOPS.dim;const vs=VS[to];vs.filters={};vs.tile=null;vs.group=null;
  const map={'Rule code':'op_rule','Source system':'op_src','Desk / book':'op_desk','Field name':'op_fname','Asset class':'f2_12'};
  if(to==='bulk'){const dm={'Rule code':'Validation rule ID','Field name':'Field','Source system':'Source system','Desk / book':'Desk','Counterparty (LEI)':'Counterparty LEI'}[d];if(dm){BG.dim=dm;go('bulk');const keys=groups(VIEW.g).map(x=>x.key);VS.bulk.group=keys.find(x=>x===k||x.startsWith(k.split(' · ')[0]))||null;refresh();return}}
  if(map[d])vs.filters[map[d]]={op:'in',vals:[k]};else if(d==='Counterparty (LEI)')vs.filters.f1_9={op:'in',vals:[k.split(' · ').pop()]};else if(d==='Legal entity (LEI)')GF.lei=k.split(' · ').pop();
  else if(d==='Ageing bucket'){const r={'0-1d':[0,1.99],'2-5d':[2,5.99],'6-10d':[6,10.99],'> 10d':[11,9999]}[k];vs.filters.op_age={op:'between',v:r[0],v2:r[1]}}
  renderHeader();go(to);toast('Opened '+DASH[to].title+' filtered to '+d+' = '+k)}

/* ---------- Reports & Exports, Admin ---------- */
function renderRep(){const ex=AUDIT.filter(a=>/^Export|Scheduled report|Export blocked/.test(a.action));
  $('#extra').innerHTML=`<div class="card"><div class="chart"><h3>Exports and scheduled reports<small>this session · ${h(TRL[GF.regime])}</small></h3><div class="tblwrap" style="max-height:60vh"><table class="tbl"><thead><tr><th>When (UTC)</th><th>User</th><th>Action</th><th>Detail</th></tr></thead><tbody>${ex.map(a=>`<tr><td class="mono">${fmtTs(a.ts)}</td><td>${h(a.user)}</td><td>${h(a.action)}</td><td class="muted">${h(a.target)}</td></tr>`).join('')||'<tr><td colspan="4" class="muted">No exports yet. Use Export to CSV on Top Contributors, or Copy CSV on any dashboard grid.</td></tr>'}</tbody></table></div>
   <p class="muted" style="margin:8px 0 0;font-size:11.5px">File names follow Submitly_&lt;Regime&gt;-&lt;TR&gt;_&lt;Report&gt;_&lt;YYYYMMDD&gt;_&lt;HHMMSS&gt;.csv. Every export is in the audit log.</p></div></div>`}
function renderAdmin(){const reg=GF.regime;const c=CFG[reg].v[CFG[reg].v.length-1];const P=CFG[reg].pending;
  const num=(id,v)=>`<input class="inp" type="number" step="0.01" id="${id}" value="${v}" style="width:78px">`;
  $('#extra').innerHTML=`<div class="split"><div class="card"><div class="chart"><h3>KPI thresholds and Health Score weights<small>${h(TRL[reg])} · EMIR</small></h3>
   <table class="tbl" style="margin-top:6px"><thead><tr><th>KPI</th><th>Green ≥</th><th>Amber ≥</th><th>Weight</th></tr></thead><tbody>
   <tr><td>Completeness</td><td>${num('cg',c.thr.comp[0])}</td><td>${num('ca',c.thr.comp[1])}</td><td>${num('wc',c.w.c)}</td></tr><tr><td>Accuracy</td><td>${num('ag',c.thr.acc[0])}</td><td>${num('aa',c.thr.acc[1])}</td><td>${num('wa',c.w.a)}</td></tr>
   <tr><td>Timeliness</td><td>${num('tg',c.thr.time[0])}</td><td>${num('ta',c.thr.time[1])}</td><td>${num('wt',c.w.t)}</td></tr><tr><td>Overall Health Score</td><td>${num('hg',c.thr.health[0])}</td><td>${num('ha',c.thr.health[1])}</td><td class="muted">sum = 100</td></tr></tbody></table>
   <div class="frm" style="margin-top:8px"><label class="muted" for="crule">Overall RAG</label><select class="inp" id="crule"><option value="worse"${c.rule==='worse'?' selected':''}>Worse of score and components</option><option value="score"${c.rule==='score'?' selected':''}>Score only</option></select><label class="muted" for="ceff">Effective from</label><input class="inp" type="date" id="ceff" value="${fmtD(TODAY)}"></div>
   <div class="err" id="cerr" style="color:var(--crit);font-size:12px"></div><div class="frm"><button class="btn pri" id="cprop"${can('cfgPropose')?'':' disabled title="Exception lead / Admin proposes"'}>Propose change</button><span class="muted" style="font-size:11.5px">Takes effect only after a Compliance approver confirms.</span></div>
   <h3 style="margin-top:14px">CSV export limit<small>Exception Dashboard</small></h3><div class="frm" style="margin-top:6px"><input class="inp" type="number" id="clim" value="${CFG.limit}" min="1" style="width:110px"><button class="btn" id="climb"${can('cfgPropose')?'':' disabled'}>Propose limit</button>${CFG.limitPending?`<span class="pill p-warn">! ${NF0.format(CFG.limitPending.v)} pending approval</span>`:''}</div></div></div>
   <div class="card"><div class="chart"><h3>Pending approvals<small>four-eyes</small></h3><div style="display:flex;flex-direction:column;gap:8px;margin-top:8px">${P.map((p,i)=>`<div class="sec" style="margin:0"><div class="frm"><b>${h(p.by)}</b><span class="muted">${fmtTs(p.ts)} · effective ${fmtD(p.eff)}</span></div><div class="mono" style="font-size:11px">C ${p.w.c}/A ${p.w.a}/T ${p.w.t} · Green C ${p.thr.comp[0]} A ${p.thr.acc[0]} T ${p.thr.time[0]} H ${p.thr.health[0]} · ${p.rule}</div>
     <div class="frm">${can('cfgApprove')?(p.byId===USER.id?'<span class="muted">You proposed this change</span>':`<button class="btn pri" data-cap="${i}">Approve</button><button class="btn danger" data-crj="${i}">Reject</button>`):'<span class="muted">Compliance approver required</span>'}</div></div>`).join('')}
     ${CFG.limitPending?`<div class="sec" style="margin:0"><div class="frm"><b>${h(CFG.limitPending.by)}</b><span class="muted">Export limit → ${NF0.format(CFG.limitPending.v)}</span></div><div class="frm">${can('cfgApprove')&&CFG.limitPending.byId!==USER.id?'<button class="btn pri" id="lap">Approve</button>':'<span class="muted">Compliance approver required</span>'}</div></div>`:''}${!P.length&&!CFG.limitPending?'<p class="muted" style="margin:0">Nothing waiting.</p>':''}</div>
     <h3 style="margin-top:14px">Effective versions<small>history points keep the thresholds effective on their date</small></h3><table class="tbl"><thead><tr><th>Effective</th><th>Weights</th><th>Proposed</th><th>Approved</th></tr></thead><tbody>${CFG[reg].v.map(v=>`<tr><td class="mono">${fmtD(v.eff)}</td><td class="mono">${v.w.c}/${v.w.a}/${v.w.t}</td><td>${h(v.by)}</td><td>${h(v.ap)}</td></tr>`).join('')}</tbody></table></div></div></div>`;
  $('#cprop').onclick=()=>{const g=id=>+$('#'+id).value;const w={c:g('wc'),a:g('wa'),t:g('wt')};if(w.c+w.a+w.t!==100){$('#cerr').textContent='Weights must sum to 100 (now '+(w.c+w.a+w.t)+')';return}
    const thr={comp:[g('cg'),g('ca')],acc:[g('ag'),g('aa')],time:[g('tg'),g('ta')],health:[g('hg'),g('ha')],pair:c.thr.pair};if(['comp','acc','time','health'].some(k=>thr[k][0]<thr[k][1])){$('#cerr').textContent='Green threshold must be at or above Amber';return}
    const eff=Date.parse($('#ceff').value+'T00:00:00Z');P.push({w,thr,rule:$('#crule').value,eff:eff||TODAY,by:USER.name,byId:USER.id,ts:now()});logA('Proposed KPI configuration',TRS_[reg]+' weights '+w.c+'/'+w.a+'/'+w.t);toast('Proposed. Waiting for Compliance approval.');renderAdmin()};
  $('#climb').onclick=()=>{const v=Math.max(1,+$('#clim').value||50000);CFG.limitPending={v,by:USER.name,byId:USER.id};logA('Proposed export limit',String(v));renderAdmin()};
  const la=$('#lap');if(la)la.onclick=()=>{CFG.limit=CFG.limitPending.v;logA('Approved export limit',String(CFG.limit));CFG.limitPending=null;toast('Export limit is now '+NF0.format(CFG.limit));renderAdmin()};
  $('#extra').querySelectorAll('[data-cap]').forEach(b=>b.onclick=()=>{const p=P.splice(+b.dataset.cap,1)[0];let eff=p.eff;while([0,6].includes(new Date(eff).getUTCDay()))eff+=DAY;CFG[reg].v.push({eff,w:p.w,thr:p.thr,rule:p.rule,by:p.by,ap:USER.name});CFG[reg].v.sort((a,b)=>a.eff-b.eff);logA('Approved KPI configuration',TRS_[reg]+' effective '+fmtD(eff));toast('Approved. Effective '+fmtD(eff));renderAdmin()});
  $('#extra').querySelectorAll('[data-crj]').forEach(b=>b.onclick=()=>{P.splice(+b.dataset.crj,1);logA('Rejected KPI configuration',TRS_[reg]);renderAdmin()})}
const _renderAudit=renderAudit;renderAudit=function(){_renderAudit();$('#gridcard').style.display='none'};

/* ---------- boot ---------- */
function boot(){
  const sel=$('#userSel');sel.innerHTML=USERS.map(u=>`<option value="${u.id}">${u.name} · ${u.role}${u.desk?' ('+u.desk+')':''}${u.trs.length===1?' · '+TRS_[u.trs[0]]+' only':''}</option>`).join('');
  sel.onchange=e=>{USER=USERS.find(u=>u.id===e.target.value);GF.desk=USER.desk||'';if(!USER.trs.includes(GF.regime))GF.regime=USER.trs[0];renderHeader();renderFoot();toast('Now acting as '+USER.name+' · '+USER.role);go(navVis(CUR)?CUR:(navVis('home')?'home':'exc'))};
  $('#themeBtn').onclick=()=>{const r=document.documentElement;const dark=r.dataset.theme?r.dataset.theme==='dark':matchMedia('(prefers-color-scheme: dark)').matches;r.dataset.theme=dark?'light':'dark';reRender()};
  $('#railBtn').onclick=()=>$('#rail').classList.toggle('open');$('#cmdBtn').onclick=palette;
  document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();palette()}});
  $('#bulkBtn').onclick=openBulk;$('#exportBtn').onclick=exportCSV;$('#schedBtn').onclick=openSchedule;$('#panelBtn').onclick=()=>{PS.col=!PS.col;store('panelCol',PS.col);renderPanel()};
  $('#jump').oninput=e=>{const q=e.target.value.trim().toLowerCase();if(!q)return;const i=GCOLS.findIndex(c=>{const f=FBY[c.id];return(f.no&&f.no===q)||f.name.toLowerCase().includes(q)});if(i>=0){const sc=$('#gscroll');sc.scrollLeft=Math.max(0,GL[i]-PW-20);ACT={ri:Math.max(0,ACT.ri),ci:i};renderRows()}};
  initGrid();initChips();initTiles();initCharts();initHeader();
  const tick=()=>{$('#clock').textContent=fmtTs(now()).replace('T',' ').slice(0,19)+(TZ==='UTC'?' UTC':'')};tick();setInterval(tick,1000);
  let start='home';const st=store('tr');if(st&&USER.trs.includes(st))GF.regime=st;
  try{const m=/^#(esma|fca)\.([a-z]+)(?:\.d(\d{8}))?$/.exec(location.hash||'');if(m){const tr=m[1].toUpperCase();if(m[3]){const t=Date.parse(m[3].slice(0,4)+'-'+m[3].slice(4,6)+'-'+m[3].slice(6)+'T00:00:00Z');if(t&&t<=TODAY){GF.from=GF.to=t;GF.preset=t===BD[TI-1]?'T-1':'Custom'}}
    if(DASH[m[2]])start=m[2];if(!USER.trs.includes(tr)){renderHeader();renderNav();renderFoot();renderFresh();accessDenied(tr);return}GF.regime=tr}}catch(e){}
  renderHeader();renderFoot();renderFresh();setInterval(renderFresh,60000);go(start)}
boot();

</script>
